<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asteroids</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
      font-family: monospace;
    }
    .ui-skins {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    .ui-skins button {
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 5px 10px;
      cursor: pointer;
      font-family: inherit;
    }
    .ui-skins button:hover {
      background: #333;
    }
    canvas {
      display: block;
      border: 1px solid #222;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="800" height="600"></canvas>
  <div class="ui-skins">
    <span>SKINS:</span>
    <button onclick="setSkin('classic')">CLASSIC</button>
    <button onclick="setSkin('interceptor')">INTERCEPTOR</button>
    <button onclick="setSkin('stealth')">STEALTH</button>
    <button onclick="setSkin('purple')">PURPLE</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
