name: issue-triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch issue data
        uses: actions/github-script@v7
        id: get-issue
        with:
          script: |
            const issue = context.payload.issue;
            return {
              number: issue.number,
              title: issue.title,
              body: issue.body || ''
            };

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: google/gemini-3.5-flash-lite
          use_github_token: true
          prompt: |
            Eres el agente de triage del repositorio "03-asteroids", un clon de Asteroids en JavaScript vanilla (sin dependencias, sin bundler, sin build). Lee los archivos AGENTS.md y game.js del repositorio actual para entender el proyecto antes de clasificar.

            Se acaba de abrir un issue. Tu tarea es clasificarlo, reformatear su cuerpo y escribir el resultado EXACTAMENTE en un archivo JSON en la ruta `/tmp/triage_result.json`.

            Título del issue:
            ${{ fromJson(steps.get-issue.outputs.result).title }}

            Cuerpo actual del issue:
            -----
            ${{ fromJson(steps.get-issue.outputs.result).body }}
            -----

            El archivo JSON en `/tmp/triage_result.json` debe tener esta estructura exacta:

            {
              "labels": ["<etiqueta1>"],
              "body": "<nuevo cuerpo en markdown, en español>"
            }

            REGLAS PARA "labels":
            - Elige entre 1 y 2 etiquetas de este conjunto permitido: bug, enhancement, question, documentation, needs-triage.
            - bug: error, fallo o comportamiento incorrecto.
            - enhancement: mejora o nueva funcionalidad.
            - question: duda o pedido de ayuda.
            - documentation: problema o mejora de la documentación.
            - needs-triage: ambiguo o no clasificable.

            REGLAS PARA "body" (markdown, en español):
            1. "## Resumen": resumen conciso del problema (1-3 oraciones).
            2. "## Información relevante": indica área probable del código, severidad (baja/media/alta) y pasos de reproducción.
            3. "## Descripción": versión reformateada y normalizada del contenido del usuario.
            4. Separador: ---
            5. "_Texto original del issue_" seguido del texto original citado línea por línea con "> ".

      - name: Parse and apply result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueNumber = ${{ fromJson(steps.get-issue.outputs.result).number }};
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (!fs.existsSync('/tmp/triage_result.json')) {
              console.log("::warning::No se encontró /tmp/triage_result.json generado por el agente.");
              return;
            }

            try {
              const data = JSON.parse(fs.readFileSync('/tmp/triage_result.json', 'utf8'));
              const labels = data.labels || ['needs-triage'];
              const body = data.body;

              if (body) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: body
                });
              }

              if (labels.length > 0) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: labels
                });
              }
              console.log(`Issue #${issueNumber} actualizado exitosamente.`);
            } catch (err) {
              console.error("Error al procesar el resultado de triage:", err);
            }
