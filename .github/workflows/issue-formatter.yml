name: Format and Label New Issues

on:
  issues:
    types: [opened]

jobs:
  format-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process and Format Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = issue.number;

            let body = issue.body || '';
            const title = issue.title;

            // 1. Detectar etiquetas basadas en palabras clave en el título o cuerpo
            const labelsToAdd = [];
            const textToAnalyze = (title + ' ' + body).toLowerCase();

            if (textToAnalyze.includes('bug') || textToAnalyze.includes('error') || textToAnalyze.includes('fallo') || textToAnalyze.includes('crash')) {
              labelsToAdd.push('bug');
            } else if (textToAnalyze.includes('feature') || textToAnalyze.includes('idea') || textToAnalyze.includes('mejora') || textToAnalyze.includes('agregar')) {
              labelsToAdd.push('enhancement');
            } else {
              labelsToAdd.push('triage');
            }

            // 2. Mantener contenido original pero añadir metadatos relevantes para revisión
            const timestamp = new Date().toISOString();
            const additionalInfo = `\n\n---\n*💡 **Información de revisión automática**:*\n- **Creado el**: \`${timestamp}\`\n- **Autor**: @${issue.user.login}\n- **Estado**: \`Pendiente de revisión\`\n`;

            const updatedBody = body + additionalInfo;

            // 3. Actualizar el issue con el nuevo cuerpo y etiquetas
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              body: updatedBody
            });

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: labelsToAdd
              });
            }

            console.log(`Issue #${issueNumber} procesado y formateado correctamente.`);
